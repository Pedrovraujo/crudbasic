<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FJ ARAUJO - Laboratório de Prótese</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css">
</head>
<body>
<header class="site-header">
    <img src="logo.png" alt="FJ ARAUJO Laboratório de Prótese" class="logo">
</header>

<main class="container">
    <section class="card">
        <h2>📋 Marcação de Pacientes</h2>

        <form id="formPessoa">
            <input type="hidden" id="idPessoa">

            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="nome" placeholder="Ex: Maria Silva" required>
            </div>

            <div class="form-group">
                <label>Idade</label>
                <input type="number" id="idade" min="1" max="120" placeholder="Ex: 35" required>
            </div>

            <div class="form-group">
                <label>Serviço</label>
                <select id="servicoSelect">
                    <option value="">(Manter serviço atual)</option>
                </select>
                <p id="descricaoServico" class="descricao"></p>
            </div>

            <div class="form-group">
                <label>Data de Atendimento</label>
                <input type="date" id="dataAtendimento" required>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="status">
                    <option value="PENDENTE">Pendente</option>
                    <option value="CONCLUIDO">Concluído</option>
                    <option value="CANCELADO">Cancelado</option>
                </select>
            </div>


            <button type="submit" class="btn" id="btnCadastrar">Cadastrar</button>
            <button type="button" class="btn-secondary" id="btnCancelar" style="display:none;">Cancelar</button>
        </form>

        <p id="mensagem"></p>
    </section>

    <section class="card">
        <h2>📅 Consultar Pacientes por Data</h2>
        <div class="form-inline">
            <input type="date" id="dataConsulta">
        </div>

        <div id="resultado">
            <h3>Pacientes Marcados</h3>
            <p id="msgLista"></p>
            <table id="tabelaPessoas">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Serviço</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 FJ ARAUJO - Laboratório de Prótese</p>
</footer>

<script src="script.js"></script>
</body>
</html>
